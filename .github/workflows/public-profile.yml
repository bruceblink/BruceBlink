name: Update public profile snapshot

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

# No permissions are inherited by future jobs. Only this trusted updater can write.
permissions: {}

concurrency:
  group: public-profile-update
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'bruceblink/BruceBlink' &&
      github.event.repository.default_branch == 'main' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Test snapshot generation
        run: python3 -m unittest discover -s tests -v

      # The collector intentionally receives no GitHub token and uses public APIs.
      # Any failed request/validation stops the job before the commit step.
      - name: Collect complete public snapshot
        run: python3 scripts/update_public_profile.py

      - name: Commit and push successful snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- README.md README.zh-CN.md dashboard/public-profile.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public profile snapshot'
          gh auth setup-git --hostname github.com
          # A concurrent change rejects this ordinary push; never overwrite it.
          git push origin HEAD:refs/heads/main
